<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Clash 网站规则</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><span class="icon">↗</span><div><h1>Clash 网站规则</h1><p>为当前网站选择访问方式</p></div></header>
<div id="connection">正在连接 Clash…</div>
<form id="form">
<label for="domain">网站域名</label><input id="domain" required placeholder="example.com" autocomplete="off" spellcheck="false">
<p class="hint">可改为主域名，例如 example.com，以覆盖 API 等子域名。</p>
<label for="type">匹配范围</label><select id="type"><option value="DOMAIN-SUFFIX">该域名及全部子域名</option><option value="DOMAIN">仅该域名</option></select>
<label for="policy">访问方式</label><select id="policy"><option value="DIRECT">直连 · DIRECT</option></select>
<div class="preview" id="preview"></div>
<button id="add" type="submit" disabled>添加并立即生效</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
<section><div class="section-head"><h2>已保存规则</h2><button id="reapply" class="text" disabled>重新应用</button></div><p class="hint">订阅更新后，可将保存的规则重新加入当前配置。</p><div id="rules"></div></section>
<footer>仅修改 Clash 规则 · 自动备份 · 失败回滚</footer>
<script src="popup.js"></script></body></html>
