name: Test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Compile Windows launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .ci-launcher | Out-Null
          dotnet new console --framework net8.0 --force --output .ci-launcher
          Copy-Item native/windows_launcher.cs .ci-launcher/Program.cs -Force
          dotnet build .ci-launcher --configuration Release --no-restore
